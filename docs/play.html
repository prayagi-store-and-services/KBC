<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KBC Web - play in your browser</title>
<style>
:root{--bg:#0d1b2a;--card:#14263b;--ac:#f2b705;--ok:#1b8a5a;--bad:#c0392b;--tx:#eef3f8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.5 system-ui,sans-serif}
header{position:fixed;top:0;left:0;right:0;height:56px;background:#08121d;display:flex;align-items:center;gap:12px;padding:0 14px;z-index:5;border-bottom:1px solid #223}
header b{font-size:18px}header span.sp{flex:1}
footer{position:fixed;bottom:0;left:0;right:0;background:#08121d;padding:8px 14px;font-size:13px;text-align:center;z-index:5}
main{max-width:860px;margin:0 auto;padding:72px 14px 70px}
.card{background:var(--card);border-radius:14px;padding:16px;margin:12px 0}
button,.btn{background:var(--ac);color:#111;border:0;border-radius:10px;padding:12px 16px;font:700 16px system-ui;cursor:pointer;text-decoration:none;display:inline-block}
button.opt{display:block;width:100%;text-align:left;margin:8px 0;background:#1d3550;color:var(--tx)}
button.opt:hover:not(:disabled){background:#27486d}button.opt.ok{background:var(--ok)}button.opt.bad{background:var(--bad)}
button.sec{background:#2a4361;color:var(--tx)}select{font:16px system-ui;padding:10px;border-radius:8px;width:100%;margin:6px 0}
.lad{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}.lad i{font-style:normal;font-size:12px;padding:3px 7px;border-radius:6px;background:#1d3550}.lad i.on{background:var(--ac);color:#111}.lad i.done{background:var(--ok)}
.sub{color:#a9bad0;font-size:14px}
@media(min-width:900px){body{font-size:20px}main{max-width:980px}}
</style></head><body>
<header><b>KBC Web</b><span class="sub" id="ver">TarkShastra</span><span class="sp"></span><span id="clock"></span></header>
<main id="app"><div class="card">Loading questions...</div></main>
<footer>Questions are AI generated and double checked by a second independent call; they can still contain errors. <a style="color:#f2b705" href="index.html">KBC home / app download</a></footer>
<script>
"use strict";
var POOL="https://raw.githubusercontent.com/prayagi-store-and-services/KBC/question-pool/pool/";
var GROUPS={"class-5":"Class 5","class-8":"Class 8","class-10":"Class 10","class-12":"Class 12","upsc":"UPSC","ssc":"SSC / State exams","banking":"Banking","general":"General"};
var app=document.getElementById("app"),lang=localStorage.getItem("kbcw_lang")||"en",S=null;
function seen(){try{return JSON.parse(localStorage.getItem("kbcw_seen")||"[]")}catch(e){return[]}}
function markSeen(id){var s=seen();if(s.indexOf(id)<0){s.push(id);localStorage.setItem("kbcw_seen",JSON.stringify(s))}}
setInterval(function(){document.getElementById("clock").textContent=new Date().toLocaleString("en-IN",{dateStyle:"medium",timeStyle:"medium"})},1000);
function el(h){var d=document.createElement("div");d.innerHTML=h;return d}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function menu(msg){
 var h='<div class="card"><h2>KBC Web</h2><p class="sub">'+(function(){var st=stats();return st.games?"Your best score on this device: <b>"+st.best+"</b> points (last: "+st.last+", games: "+st.games+"). Stored only in this browser.":"Your best score on this device: Unavailable (no game played yet)."})()+'</p><p class="sub">17 questions, easy to hard. Sound and voice need a tap to start; if your browser blocks them they show as Unavailable. Pick your group and language.</p>'+(msg?'<p>'+esc(msg)+'</p>':'')+
 '<label>Group</label><select id="g">'+Object.keys(GROUPS).map(function(k){return'<option value="'+k+'">'+GROUPS[k]+'</option>'}).join("")+'</select>'+
 '<label>Language</label><select id="l"><option value="en">English</option><option value="hi">Hindi</option></select>'+
 '<p class="sub">Each question is timed like the app: 60 s for questions 1-5, 120 s for 6-10, no limit after that. The question and options are read aloud and there are suspense sounds (you can switch both off in the game). Tap an option, then press Lock answer. On a computer: press A, B, C or D to choose, Enter or L to lock, N or Enter for the next question. Questions you already saw on this device are not shown again (stored only in this browser).</p><button id="go">Start game</button></div>';
 app.innerHTML=h;document.getElementById("l").value=lang;
 document.getElementById("go").onclick=function(){lang=document.getElementById("l").value;localStorage.setItem("kbcw_lang",lang);start(document.getElementById("g").value)}}
function start(g){
 app.innerHTML='<div class="card">Loading questions...</div>';
 fetch(POOL+g+".json",{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(all){
  var sn=seen(),spare={},pick=[],bands=[["easy",5],["medium",6],["hard",6]],short=[];
  bands.forEach(function(b){var c=all.filter(function(q){return q.band===b[0]&&sn.indexOf(q.id)<0&&Array.isArray(q.optsEn)&&q.optsEn.length===4&&typeof q.correct==="number"});
   c.sort(function(){return Math.random()-.5});if(c.length<b[1])short.push(b[0]);pick=pick.concat(c.slice(0,b[1]));spare[b[0]]=c.slice(b[1],b[1]+2)});
  if(short.length){menu("Not enough new questions left for this group ("+short.join(", ")+"). Choose another group. Unavailable: more questions arrive as the pool grows.");return}
  S={g:g,q:pick,i:0,spare:spare,fifty:true,flip:true,won:0,sec:0};show()}).catch(function(){app.innerHTML='<div class="card">Question bank: Unavailable right now (could not load). Try again later.</div>'})}
var SND={on:localStorage.getItem("kbcw_snd")!=="0"},VOX={on:localStorage.getItem("kbcw_vox")!=="0",ok:("speechSynthesis" in window)},AC=null,TM={id:0,pulse:0};
function ac(){if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(!C)return null;try{AC=new C()}catch(e){return null}}if(AC.state==="suspended"){try{AC.resume()}catch(e){}}return AC}
function tone(f,ms,vol,type,delay){if(!SND.on)return;var c=ac();if(!c)return;try{var o=c.createOscillator(),g=c.createGain(),t=c.currentTime+(delay||0)/1000;o.type=type||"sine";o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(vol,0.0002),t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+ms/1000);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+ms/1000+0.03)}catch(e){}}
function sfx(n){
 if(n==="sel")tone(520,80,.15,"sine");
 else if(n==="lock"){tone(110,1400,.25,"sawtooth");tone(165,1400,.12,"sine");tone(55,1400,.3,"sine")}
 else if(n==="ok"){[523,659,784,1047].forEach(function(f,k){tone(f,420,.2,"triangle",k*140)})}
 else if(n==="bad"){tone(130,500,.3,"sawtooth");tone(90,700,.3,"square",160)}
 else if(n==="fifty"){[900,700,500,350].forEach(function(f,k){tone(f,90,.15,"sine",k*60)})}
 else if(n==="flip"){tone(400,80,.15,"triangle");tone(600,80,.15,"triangle",90);tone(800,120,.15,"triangle",180)}
 else if(n==="time"){tone(200,300,.3,"square");tone(150,500,.3,"square",320)}}
function stopPressure(){if(TM.pulse){clearTimeout(TM.pulse);TM.pulse=0}}
function pressure(){
 stopPressure();
 function p(){if(!S||S.locked||S.over)return;var u=0,iv=1400,v=.14;
  if(S.limit){var r=Math.max(0,Math.min(1,(S.deadline-Date.now())/(S.limit*1000)));u=1-r;iv=1000-u*650;v=.3+u*.28}
  tone(65+u*45,90+u*40,v,"sine");setTimeout(function(){tone(750+u*400,25,.18+u*.3,"square")},40);
  TM.pulse=setTimeout(p,iv)}
 p()}
function stopTimer(){if(TM.id){clearInterval(TM.id);TM.id=0}stopPressure()}
function stopVox(){if(VOX.ok){try{window.speechSynthesis.cancel()}catch(e){}}}
function say(t,calm){if(!VOX.ok||!VOX.on||!t)return;try{var u=new SpeechSynthesisUtterance(t);u.lang=lang==="hi"?"hi-IN":"en-IN";u.rate=calm?0.9:1;var vs=window.speechSynthesis.getVoices(),pre=lang==="hi"?"hi":"en";for(var k=0;k<vs.length;k++){if(vs[k].lang&&vs[k].lang.toLowerCase().indexOf(pre)===0){u.voice=vs[k];break}}window.speechSynthesis.speak(u)}catch(e){}}
var PTS=[10,15,20,25,30,40,50,60,70,180,50,60,70,80,90,100,50],CPN={5:"1st Checkpoint",10:"2nd Checkpoint",16:"3rd Checkpoint",17:"Final Crown"};
function limitFor(n){return n<=5?60:n<=10?120:null}
function bar(){
 return '<div class="sub" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><button class="sec" id="snd" style="padding:6px 10px;font-size:14px">Sound: '+(SND.on?"on":"off")+'</button>'+
 (VOX.ok?'<button class="sec" id="vox" style="padding:6px 10px;font-size:14px">Voice: '+(VOX.on?"on":"off")+'</button>':'<span>Voice: Unavailable in this browser</span>')+'</div>'}
function wireBar(){
 var a=document.getElementById("snd"),b=document.getElementById("vox");
 if(a)a.onclick=function(){SND.on=!SND.on;localStorage.setItem("kbcw_snd",SND.on?"1":"0");a.textContent="Sound: "+(SND.on?"on":"off");if(!SND.on)stopPressure();else if(S&&!S.locked&&!S.over)pressure()};
 if(b)b.onclick=function(){VOX.on=!VOX.on;localStorage.setItem("kbcw_vox",VOX.on?"1":"0");b.textContent="Voice: "+(VOX.on?"on":"off");if(!VOX.on)stopVox()}}
function show(){
 stopTimer();stopVox();
 var q=S.q[S.i],o=lang==="hi"&&q.optsHi?q.optsHi:q.optsEn,t=lang==="hi"&&q.qHi?q.qHi:q.qEn,lad="";
 S.sel=null;S.locked=false;S.over=false;S.gone={};S.limit=limitFor(S.i+1);S.deadline=S.limit?Date.now()+S.limit*1000:0;
 for(var i=0;i<S.q.length;i++)lad+='<i class="'+(i<S.i?"done":i===S.i?"on":"")+'" title="'+PTS[i]+' points'+(CPN[i+1]?" - "+CPN[i+1]:"")+'">'+(i+1)+(CPN[i+1]?"*":"")+'</i>';
 app.innerHTML='<div class="card"><div class="lad">'+lad+'</div><p class="sub">Question '+(S.i+1)+' of '+S.q.length+' - '+q.band+'</p><p class="sub">This question: <b>'+PTS[S.i]+' points</b>'+(CPN[S.i+1]?' - <b>'+CPN[S.i+1]+'</b> (points are secured)':"")+' | Points now: <b>'+S.won+'</b> | Secured: <b>'+S.sec+'</b></p><p id="tm" style="font-weight:700;font-size:20px"></p><h3>'+esc(t)+'</h3><div id="o"></div><button id="lk" disabled>Lock answer</button><div id="ll"></div><div id="fb"></div></div>'+bar()+'<button class="sec" id="quit" style="margin-top:10px">Quit</button>';
 wireBar();
 var box=document.getElementById("o");
 o.forEach(function(x,idx){var b=document.createElement("button");b.className="opt";b.textContent=String.fromCharCode(65+idx)+". "+x;b.onclick=function(){pick(idx,box)};box.appendChild(b)});
 document.getElementById("lk").onclick=function(){lockIn(box)};
 lifelines(box);document.getElementById("quit").onclick=function(){stopTimer();stopVox();S.over=true;end("You quit after "+S.i+" correct answer(s). Points: "+S.won+".",S.won)};
 var tm=document.getElementById("tm");
 function tick(){if(S.locked||S.over){return}if(!S.limit){tm.textContent="No time limit on this question";return}
  var r=Math.max(0,Math.ceil((S.deadline-Date.now())/1000));tm.textContent="Time left: "+r+" s";tm.style.color=r<=10?"#ff6b5b":"";if(r<=0)timeUp(box)}
 tick();TM.id=setInterval(tick,250);pressure();
 say(t+". "+o.map(function(x,k){return String.fromCharCode(65+k)+". "+x}).join(". "))}
function pick(i,box){
 if(S.locked||S.over||S.gone[i])return;S.sel=i;sfx("sel");
 box.querySelectorAll("button").forEach(function(b,k){b.classList.toggle("sel",k===i);b.style.outline=k===i?"3px solid #f2b705":""});
 document.getElementById("lk").disabled=false}
function lockIn(box){
 if(S.locked||S.over||S.sel===null)return;
 S.locked=true;stopTimer();stopVox();sfx("lock");
 var bs=box.querySelectorAll("button");bs.forEach(function(b){b.disabled=true});
 document.getElementById("lk").disabled=true;document.getElementById("tm").textContent="Locked. Checking...";
 setTimeout(function(){reveal(S.sel,box,false)},2200)}
function timeUp(box){
 if(S.locked||S.over)return;S.locked=true;stopTimer();stopVox();
 box.querySelectorAll("button").forEach(function(b){b.disabled=true});document.getElementById("lk").disabled=true;
 reveal(-1,box,true)}
function reveal(i,box,timeout){
 var q=S.q[S.i],bs=box.querySelectorAll("button");markSeen(q.id);S.over=true;
 bs.forEach(function(b,k){b.disabled=true;b.style.outline="";if(k===q.correct)b.className="opt ok";else if(k===i)b.className="opt bad"});
 var fb=document.getElementById("fb"),ok=i===q.correct,L=String.fromCharCode(65+q.correct),last=S.i>=S.q.length-1,cp=!!CPN[S.i+1];
 if(ok){S.won=PTS[S.i];if(cp)S.sec=S.won}
 document.getElementById("tm").textContent=timeout?"Time is up":"";
 sfx(timeout?"time":ok?"ok":"bad");if(ok&&cp)setTimeout(function(){tone(784,300,.2,"triangle");tone(1047,500,.2,"triangle",200)},700);
 var exp=(lang==="hi"&&q.explainHi)?q.explainHi:q.explainEn;
 fb.innerHTML='<p><b>'+(ok?"Correct! You have "+S.won+" points"+(cp?" - "+CPN[S.i+1]+" reached, secured.":"."):(timeout?"Time up. ":"Wrong. ")+"Correct answer: "+L)+'</b></p>'+(exp?'<p class="sub">'+esc(exp)+'</p>':"")+'<button id="nx">'+(ok&&!last?"Next question":"Finish")+'</button>';
 setTimeout(function(){say(ok?(lang==="hi"?"सही जवाब":"Correct answer"):((timeout?(lang==="hi"?"समय समाप्त. ":"Time is up. "):(lang==="hi"?"गलत जवाब. ":"Wrong answer. "))+(lang==="hi"?"सही उत्तर ":"The correct answer is ")+L+". "+(q.explainEn&&lang!=="hi"?q.explainEn:"")),!ok)},900);
 document.getElementById("nx").onclick=function(){stopVox();if(ok&&!last){S.i++;show()}else end(ok?"You answered all "+S.q.length+" questions correctly! Final points: "+S.won+".":"Game over. You answered "+S.i+" correctly. You take home the secured points: "+S.sec+".",ok?S.won:S.sec)}}
function lifelines(box){
 var ll=document.getElementById("ll"),q=S.q[S.i];
 var a=document.createElement("button");a.className="sec";a.textContent="50-50";a.disabled=!S.fifty;
 a.onclick=function(){if(S.locked||S.over)return;S.fifty=false;sfx("fifty");var w=[0,1,2,3].filter(function(k){return k!==q.correct}).sort(function(){return Math.random()-.5}).slice(0,2);
  box.querySelectorAll("button").forEach(function(b,k){if(w.indexOf(k)>=0){S.gone[k]=true;b.disabled=true;b.style.opacity=".3";if(S.sel===k){S.sel=null;b.style.outline="";document.getElementById("lk").disabled=true}}});a.disabled=true};
 var f=document.createElement("button");f.className="sec";f.style.marginLeft="8px";var sp=S.spare[q.band]||[];f.textContent="Flip question";f.disabled=!S.flip||!sp.length;
 f.onclick=function(){if(S.locked||S.over)return;S.flip=false;sfx("flip");S.q[S.i]=sp.shift();show()};
 ll.appendChild(a);ll.appendChild(f);
 var n=document.createElement("p");n.className="sub";n.textContent="Lifelines: 50-50 and Flip are real. Audience poll and Phone-a-friend are not offered because they would need invented data.";ll.appendChild(n)}
function stats(){try{return JSON.parse(localStorage.getItem("kbcw_stats")||"{}")}catch(e){return{}}}
function end(m,pts){stopTimer();stopVox();S&&(S.over=true);if(typeof pts==="number"){var st=stats();st.games=(st.games||0)+1;st.best=Math.max(st.best||0,pts);st.last=pts;localStorage.setItem("kbcw_stats",JSON.stringify(st))}app.innerHTML='<div class="card"><h2>'+esc(m)+'</h2><button id="again">Play again</button></div>';document.getElementById("again").onclick=function(){menu()}}
document.addEventListener("keydown",function(e){if(e.ctrlKey||e.metaKey||e.altKey)return;var k=e.key.toLowerCase(),i="abcd".indexOf(k);
 if(i>=0&&k.length===1){var b=document.querySelectorAll("#o button.opt");if(b[i]&&!b[i].disabled)b[i].click()}
 else if(k==="l"||k==="enter"){var nx=document.getElementById("nx");if(nx){nx.click()}else{var lk=document.getElementById("lk");if(lk&&!lk.disabled)lk.click()}}
 else if(k==="n"){var nx2=document.getElementById("nx");if(nx2)nx2.click()}});
menu();
</script></body></html>
